<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Etwas oder vielleicht auch nicht - Eine interaktive Seite">
  <title>Etwas oder vielleicht auch nicht? 🤔</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #f43f5e;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #22d3ee;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --bg-card: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
      }
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: fadeInUp 0.8s ease-out;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 3rem;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .card {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease-out 0.4s both;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
    }

    .mood-display {
      font-size: 4rem;
      margin: 1.5rem 0;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .mood-display:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .mood-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
      min-height: 2.5rem;
      transition: all 0.3s ease;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--text-muted);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    footer {
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .easter-egg {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .easter-egg.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mode-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .mode-btn {
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border: 2px solid var(--text-muted);
      background: transparent;
      color: var(--text-muted);
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .mode-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: transparent;
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .mode-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .history-panel {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-panel summary {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
    }

    .history-panel summary::-webkit-details-marker {
      display: none;
    }

    .history-panel summary::before {
      content: '▼';
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .history-panel[open] summary::before {
      transform: rotate(180deg);
    }

    .history-list {
      list-style: none;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .history-item.etwas { border-left: 3px solid var(--accent); }
    .history-item.nichts { border-left: 3px solid var(--text-muted); }
    .history-item.ja { border-left: 3px solid #22c55e; }
    .history-item.nein { border-left: 3px solid #ef4444; }
    .history-item.wahr { border-left: 3px solid #8b5cf6; }
    .history-item.falsch { border-left: 3px solid #f97316; }

    .history-emoji { font-size: 1.25rem; }
    .history-text { flex: 1; font-weight: 500; }
    .history-time { color: var(--text-muted); font-size: 0.75rem; white-space: nowrap; }

    .clear-history {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-history:hover {
      border-color: var(--secondary);
      color: var(--secondary);
    }

    @media (max-width: 480px) {
      .mode-btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
      .stats { gap: 1rem; }
      .stat-value { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Etwas oder vielleicht auch nicht?</h1>
      <p class="subtitle">Die wichtigste Frage des Universums… oder auch nicht 🤷‍♂️</p>
    </header>

    <article class="card">
      <div class="mode-selector" id="modeSelector" role="tablist" aria-label="Entscheidungs-Modus wählen"></div>
      
      <div class="mood-display" id="moodDisplay" role="button" tabindex="0" aria-label="Entscheidung treffen">🤔</div>
      <div class="mood-text" id="moodText">Wähle einen Modus und klicke unten!</div>
      
      <div class="btn-group">
        <button class="btn btn-primary" id="decideBtn">
          <span>🎲 Entscheiden</span>
        </button>
        <button class="btn btn-secondary" id="resetBtn">
          <span>🔄 Zurücksetzen</span>
        </button>
      </div>

      <div class="stats" id="statsContainer">
        <div class="stat-item">
          <span class="stat-value" id="count">0</span>
          <span>Entscheidungen</span>
        </div>
        <div class="stat-item" id="statPositive">
          <span class="stat-value" id="positiveCount">0</span>
          <span id="positiveLabel">Etwas</span>
        </div>
        <div class="stat-item" id="statNegative">
          <span class="stat-value" id="negativeCount">0</span>
          <span id="negativeLabel">Nichts</span>
        </div>
      </div>

      <details class="history-panel" id="historyPanel">
        <summary>📜 Verlauf (<span id="historyCount">0</span>)</summary>
        <ul class="history-list" id="historyList"></ul>
        <button class="clear-history" id="clearHistory">Verlauf löschen</button>
      </details>
    </article>

    <footer>
      Made with ❤️ & <a href="https://github.com/Benninator11" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>

  <div class="easter-egg" id="easterEgg">Konami-Code für Überraschung… ↑↑↓↓←→←→BA</div>

  <script>
    (function() {
      'use strict';

      // Decision Modes
      const modes = {
        'etwas-nichts': {
          name: 'Etwas / Nichts',
          icon: '🤔',
          positive: { label: 'Etwas', key: 'etwasCount', emoji: '✨', color: 'var(--accent)' },
          negative: { label: 'Nichts', key: 'nichtsCount', emoji: '🤷‍♂️', color: 'var(--text-muted)' },
          moods: {
            positive: [
              { emoji: '✨', text: 'Definitiv ETWAS!', class: 'pulse' },
              { emoji: '🎉', text: 'JA, absolut ETWAS!', class: 'pulse' },
              { emoji: '🌟', text: '100% ETWAS!', class: 'pulse' },
              { emoji: '🚀', text: 'Voll das ETWAS!', class: 'pulse' },
              { emoji: '💫', text: 'Etwas ganz Großes!', class: 'pulse' }
            ],
            negative: [
              { emoji: '🤷‍♂️', text: 'Eher NICHTS…', class: '' },
              { emoji: '😴', text: 'Nichts zu sehen hier', class: '' },
              { emoji: '🕳️', text: 'Leere. Nichts.', class: '' },
              { emoji: '🌫️', text: 'Nur Nebel…', class: '' },
              { emoji: '🫥', text: 'Unsichtbares Nichts', class: '' }
            ]
          }
        },
        'ja-nein': {
          name: 'Ja / Nein',
          icon: '❓',
          positive: { label: 'Ja', key: 'jaCount', emoji: '✅', color: '#22c55e' },
          negative: { label: 'Nein', key: 'neinCount', emoji: '❌', color: '#ef4444' },
          moods: {
            positive: [
              { emoji: '✅', text: 'JA! Auf jeden Fall!', class: 'pulse' },
              { emoji: '👍', text: 'Definitiv JA!', class: 'pulse' },
              { emoji: '🎯', text: '100% JA!', class: 'pulse' },
              { emoji: '🙌', text: 'Klares JA!', class: 'pulse' },
              { emoji: '💚', text: 'Absolut JA!', class: 'pulse' }
            ],
            negative: [
              { emoji: '❌', text: 'Eher NEIN…', class: '' },
              { emoji: '🙅‍♂️', text: 'Nein, definitiv nicht', class: '' },
              { emoji: '🚫', text: 'Absolutes NEIN', class: '' },
              { emoji: '👎', text: 'Nö.', class: '' },
              { emoji: '🛑', text: 'Nicht mal im Traum', class: '' }
            ]
          }
        },
        'wahr-falsch': {
          name: 'Wahr / Falsch',
          icon: '🧠',
          positive: { label: 'Wahr', key: 'wahrCount', emoji: '✓', color: '#8b5cf6' },
          negative: { label: 'Falsch', key: 'falschCount', emoji: '✗', color: '#f97316' },
          moods: {
            positive: [
              { emoji: '✓', text: 'WAHR!', class: 'pulse' },
              { emoji: '🎓', text: 'Absolut WAHR', class: 'pulse' },
              { emoji: '📜', text: 'Bewiesen: WAHR', class: 'pulse' },
              { emoji: '🔬', text: 'Wissenschaftlich WAHR', class: 'pulse' },
              { emoji: '💎', text: 'Unbestreitbar WAHR', class: 'pulse' }
            ],
            negative: [
              { emoji: '✗', text: 'FALSCH!', class: '' },
              { emoji: '🤥', text: 'Das ist FALSCH', class: '' },
              { emoji: '🚨', text: 'Fake News - FALSCH', class: '' },
              { emoji: '🗑️', text: 'Müll. FALSCH.', class: '' },
              { emoji: '🙃', text: 'Ganz sicher FALSCH', class: '' }
            ]
          }
        },
        'pizza-keine': {
          name: 'Pizza / Keine Pizza',
          icon: '🍕',
          positive: { label: 'Pizza', key: 'pizzaCount', emoji: '🍕', color: '#f97316' },
          negative: { label: 'Keine Pizza', key: 'keinePizzaCount', emoji: '🥗', color: '#22c55e' },
          moods: {
            positive: [
              { emoji: '🍕', text: 'PIZZA! Immer PIZZA!', class: 'pulse' },
              { emoji: '🍕', text: 'JA zur Pizza!', class: 'pulse' },
              { emoji: '🍕', text: 'Pizza ist die Antwort', class: 'pulse' },
              { emoji: '🍕', text: 'Extra Käse, bitte!', class: 'pulse' },
              { emoji: '🍕', text: 'Pizza > Alles', class: 'pulse' }
            ],
            negative: [
              { emoji: '🥗', text: 'Heute Salat…', class: '' },
              { emoji: '🚫🍕', text: 'Keine Pizza für dich', class: '' },
              { emoji: '🥦', text: 'Brokkoli statt Pizza', class: '' },
              { emoji: '😢', text: 'Traurig ohne Pizza', class: '' },
              { emoji: '🍎', text: 'Apfel. Ernsthaft?', class: '' }
            ]
          }
        },
        'kaffee-tee': {
          name: 'Kaffee / Tee',
          icon: '☕',
          positive: { label: 'Kaffee', key: 'kaffeeCount', emoji: '☕', color: '#78350f' },
          negative: { label: 'Tee', key: 'teeCount', emoji: '🍵', color: '#166534' },
          moods: {
            positive: [
              { emoji: '☕', text: 'KAFFEE! Jetzt!', class: 'pulse' },
              { emoji: '☕', text: 'Leben = Kaffee', class: 'pulse' },
              { emoji: '☕', text: 'Doppelter Espresso', class: 'pulse' },
              { emoji: '☕', text: 'But first, coffee', class: 'pulse' },
              { emoji: '☕', text: 'Koffein fließt', class: 'pulse' }
            ],
            negative: [
              { emoji: '🍵', text: 'Tee Zeit 🍃', class: '' },
              { emoji: '🍵', text: 'Grüner Tee, bitte', class: '' },
              { emoji: '🍵', text: 'Kamille für die Nerven', class: '' },
              { emoji: '🍵', text: 'Tee > Kaffee', class: '' },
              { emoji: '🍵', text: 'Entspannt trinken', class: '' }
            ]
          }
        },
        'aktion-pause': {
          name: 'Aktion / Pause',
          icon: '⚡',
          positive: { label: 'Aktion', key: 'aktionCount', emoji: '🏃', color: '#dc2626' },
          negative: { label: 'Pause', key: 'pauseCount', emoji: '😴', color: '#2563eb' },
          moods: {
            positive: [
              { emoji: '🏃', text: 'LOS JETZT!', class: 'pulse' },
              { emoji: '⚡', text: 'Action Mode ON', class: 'pulse' },
              { emoji: '💪', text: 'Mach was draus!', class: 'pulse' },
              { emoji: '🚀', text: 'Volle Kraft voraus!', class: 'pulse' },
              { emoji: '🔥', text: 'Brenn dafür!', class: 'pulse' }
            ],
            negative: [
              { emoji: '😴', text: 'Chill mal…', class: '' },
              { emoji: '🛋️', text: 'Couch ruft', class: '' },
              { emoji: '🧘', text: 'Atmen. Entspannen.', class: '' },
              { emoji: '😌', text: 'Pause verdient', class: '' },
              { emoji: '💤', text: 'Nickerchen?', class: '' }
            ]
          }
        }
      };

      // State
      const state = {
        currentMode: 'etwas-nichts',
        count: 0,
        etwasCount: 0,
        nichtsCount: 0,
        jaCount: 0,
        neinCount: 0,
        wahrCount: 0,
        falschCount: 0,
        pizzaCount: 0,
        keinePizzaCount: 0,
        kaffeeCount: 0,
        teeCount: 0,
        aktionCount: 0,
        pauseCount: 0,
        history: []
      };

      // DOM Elements
      const moodDisplay = document.getElementById('moodDisplay');
      const moodText = document.getElementById('moodText');
      const decideBtn = document.getElementById('decideBtn');
      const resetBtn = document.getElementById('resetBtn');
      const countEl = document.getElementById('count');
      const positiveCountEl = document.getElementById('positiveCount');
      const negativeCountEl = document.getElementById('negativeCount');
      const positiveLabelEl = document.getElementById('positiveLabel');
      const negativeLabelEl = document.getElementById('negativeLabel');
      const modeSelector = document.getElementById('modeSelector');
      const historyPanel = document.getElementById('historyPanel');
      const historyList = document.getElementById('historyList');
      const historyCountEl = document.getElementById('historyCount');
      const clearHistoryBtn = document.getElementById('clearHistory');
      const statsContainer = document.getElementById('statsContainer');
      const easterEgg = document.getElementById('easterEgg');

      // Load state from localStorage
      function loadState() {
        const saved = localStorage.getItem('etwas-oder-nicht');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            Object.assign(state, parsed);
            // Ensure all keys exist
            Object.keys(modes).forEach(modeKey => {
              const mode = modes[modeKey];
              if (!state[mode.positive.key]) state[mode.positive.key] = 0;
              if (!state[mode.negative.key]) state[mode.negative.key] = 0;
            });
            renderModeSelector();
            updateStats();
            renderHistory();
          } catch (e) {
            console.warn('Could not load state:', e);
            renderModeSelector();
          }
        } else {
          renderModeSelector();
        }
      }

      // Save state to localStorage
      function saveState() {
        localStorage.setItem('etwas-oder-nicht', JSON.stringify(state));
      }

      // Render mode selector buttons
      function renderModeSelector() {
        modeSelector.innerHTML = '';
        Object.entries(modes).forEach(([key, mode]) => {
          const btn = document.createElement('button');
          btn.className = 'mode-btn' + (key === state.currentMode ? ' active' : '');
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', key === state.currentMode);
          btn.setAttribute('data-mode', key);
          btn.innerHTML = `${mode.icon} ${mode.name}`;
          btn.addEventListener('click', () => switchMode(key));
          modeSelector.appendChild(btn);
        });
      }

      // Switch mode
      function switchMode(modeKey) {
        state.currentMode = modeKey;
        renderModeSelector();
        updateStats();
        resetDisplay();
        saveState();
      }

      // Update stats display
      function updateStats() {
        const mode = modes[state.currentMode];
        countEl.textContent = state.count;
        positiveCountEl.textContent = state[mode.positive.key] || 0;
        negativeCountEl.textContent = state[mode.negative.key] || 0;
        positiveLabelEl.textContent = mode.positive.label;
        negativeLabelEl.textContent = mode.negative.label;
        historyCountEl.textContent = state.history.length;
      }

      // Reset display to neutral
      function resetDisplay() {
        const mode = modes[state.currentMode];
        moodDisplay.textContent = mode.icon;
        moodDisplay.className = 'mood-display';
        moodText.textContent = `Modus: ${mode.name} — Klicke unten!`;
        moodText.style.color = '';
      }

      // Get random mood for current mode
      function getRandomMood(type) {
        const mode = modes[state.currentMode];
        const arr = mode.moods[type] || [{ emoji: mode.icon, text: 'Hmm…', class: '' }];
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // Decide
      function decide() {
        const mode = modes[state.currentMode];
        const isPositive = Math.random() > 0.5;
        const type = isPositive ? 'positive' : 'negative';
        const mood = getRandomMood(type);

        // Update state
        state.count++;
        if (isPositive) state[mode.positive.key]++;
        else state[mode.negative.key]++;
        
        const historyEntry = {
          mode: state.currentMode,
          type: isPositive ? mode.positive.label.toLowerCase() : mode.negative.label.toLowerCase(),
          emoji: mood.emoji,
          text: mood.text,
          timestamp: Date.now()
        };
        state.history.unshift(historyEntry);
        if (state.history.length > 50) state.history.pop();
        
        saveState();
        updateStats();
        renderHistory();

        // Animate
        moodDisplay.style.transform = 'scale(0) rotate(180deg)';
        moodText.style.opacity = '0';

        setTimeout(() => {
          moodDisplay.textContent = mood.emoji;
          moodDisplay.className = 'mood-display ' + (mood.class || '');
          moodText.textContent = mood.text;
          moodText.style.color = isPositive ? mode.positive.color : mode.negative.color;
          
          moodDisplay.style.transform = 'scale(1) rotate(0deg)';
          moodText.style.opacity = '1';
        }, 150);

        // Button feedback
        decideBtn.style.transform = 'scale(0.95)';
        setTimeout(() => decideBtn.style.transform = '', 100);
      }

      // Reset current mode stats
      function reset() {
        const mode = modes[state.currentMode];
        state[mode.positive.key] = 0;
        state[mode.negative.key] = 0;
        saveState();
        updateStats();
        resetDisplay();

        resetBtn.style.transform = 'scale(0.95)';
        setTimeout(() => resetBtn.style.transform = '', 100);
      }

      // Render history
      function renderHistory() {
        historyList.innerHTML = '';
        state.history.forEach((entry, index) => {
          const li = document.createElement('li');
          li.className = `history-item ${entry.type}`;
          const time = new Date(entry.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
          li.innerHTML = `
            <span class="history-emoji">${entry.emoji}</span>
            <span class="history-text">${entry.text}</span>
            <span class="history-time">${time}</span>
          `;
          historyList.appendChild(li);
        });
        historyCountEl.textContent = state.history.length;
      }

      // Clear history
      function clearHistory() {
        state.history = [];
        saveState();
        renderHistory();
      }

      // Konami code easter egg
      let konamiIndex = 0;
      const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];

      function handleKeydown(e) {
        if (e.code === konamiCode[konamiIndex]) {
          konamiIndex++;
          if (konamiIndex === konamiCode.length) {
            activateEasterEgg();
            konamiIndex = 0;
          }
        } else {
          konamiIndex = 0;
        }
      }

      function activateEasterEgg() {
        easterEgg.classList.add('visible');
        moodDisplay.textContent = '🦄';
        moodText.textContent = 'DU HAST DEN GEHEIMEN MODUS GEFUNDEN! 🌈✨';
        moodText.style.color = 'var(--secondary)';
        moodDisplay.className = 'mood-display pulse';
        
        // Confetti effect
        for (let i = 0; i < 30; i++) {
          createConfetti();
        }

        setTimeout(() => easterEgg.classList.remove('visible'), 5000);
      }

      function createConfetti() {
        const confetti = document.createElement('div');
        confetti.style.cssText = `
          position: fixed;
          width: 10px;
          height: 10px;
          background: ${['var(--primary)', 'var(--accent)', 'var(--secondary)', '#fbbf24', '#34d399'][Math.floor(Math.random() * 5)]};
          left: ${Math.random() * 100}vw;
          top: -10px;
          border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
          pointer-events: none;
          z-index: 1000;
          animation: fall ${2 + Math.random() * 2}s linear forwards;
        `;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }

      // Add confetti animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fall {
          to {
            transform: translateY(110vh) rotate(${Math.random() * 720}deg);
            opacity: 0;
          }
        }
      `;
      document.head.appendChild(style);

      // Event listeners
      decideBtn.addEventListener('click', decide);
      resetBtn.addEventListener('click', reset);
      moodDisplay.addEventListener('click', decide);
      moodDisplay.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          decide();
        }
      });
      clearHistoryBtn.addEventListener('click', clearHistory);
      document.addEventListener('keydown', handleKeydown);

      // Initialize
      loadState();
    })();
  </script>
</body>
</html>
